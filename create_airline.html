/* ============================================================
   ACS CREATE AIRLINE — OPERATIONS SETUP
   ============================================================ */

body {
  margin: 0;
  min-height: 100vh;

  display: flex;
  flex-direction: column;

  color: #ffffff;
  font-family: "Segoe UI", sans-serif;

  background: #071427;

  position: relative;
  overflow-x: hidden;
}


/* ============================================================
   CREATE AIRLINE MAIN CARD
   ============================================================ */

.form-container {
  width: min(560px, calc(100% - 32px));

  margin: 128px auto 70px;
  padding: 34px 34px 32px;

  box-sizing: border-box;
  position: relative;

  color: #ffffff;
  text-align: center;

  background:
    linear-gradient(
      180deg,
      rgba(6, 17, 38, 0.97) 0%,
      rgba(2, 9, 22, 0.985) 100%
    );

  border:
    1px solid rgba(255, 170, 24, 0.76);

  border-radius: 22px;

  box-shadow:
    0 24px 58px rgba(0, 0, 0, 0.54),
    0 0 22px rgba(255, 179, 0, 0.055),
    inset 0 0 28px rgba(255, 179, 0, 0.025);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  animation:
    createAirlineCardEntry 0.75s ease forwards;
}

@keyframes createAirlineCardEntry {
  from {
    opacity: 0;
    transform: translateY(16px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}


/* ============================================================
   CREATE AIRLINE PRIMARY TITLE
   ============================================================ */

.form-container h2 {
  margin: 0;

  font-family:
    "Orbitron",
    "Eurostile",
    "Exo 2",
    sans-serif;

  font-size: 1.42rem;
  font-weight: 600;

  line-height: 1.2;
  letter-spacing: 0.17em;

  background:
  linear-gradient(
    180deg,
    #ffe08a 0%,
    #ffc94a 22%,
    #ffb300 55%,
    #d98b00 100%
  );

-webkit-background-clip: text;
background-clip: text;

-webkit-text-fill-color: transparent;
color: transparent;

text-shadow:
  0 0 7px rgba(255, 179, 0, 0.20),
  0 0 16px rgba(255, 179, 0, 0.10);

  text-transform: uppercase;

  text-shadow:
    0 0 8px rgba(255, 255, 255, 0.20),
    0 0 18px rgba(255, 255, 255, 0.08);
}


/* ============================================================
   CREATE AIRLINE GOLD SEPARATOR
   ============================================================ */

.form-container h2::after {
  content: "";

  display: block;

  width: 76%;
  height: 1px;

  margin: 22px auto 24px;

  background:
    linear-gradient(
      90deg,
      transparent 0%,
      rgba(255, 182, 35, 0.15) 22%,
      #ffc74a 50%,
      rgba(255, 182, 35, 0.15) 78%,
      transparent 100%
    );

  box-shadow:
    0 0 7px rgba(255, 190, 50, 0.62),
    0 0 15px rgba(255, 190, 50, 0.22);
}


/* ============================================================
   CREATE AIRLINE DESCRIPTION
   ============================================================ */

.form-container > p {
  max-width: 410px;

  margin: 0 auto 27px;

  color:
    rgba(235, 239, 250, 0.88);

  font-family:
    "Segoe UI",

  letter-spacing: 0.01em;

}


/* ============================================================
   CREATE AIRLINE FORM
   ============================================================ */

#createAirlineForm {
  display: flex;
  flex-direction: column;

  gap: 13px;

  width: 100%;
  margin: 0;

  text-align: left;
}


/* ============================================================
   CREATE AIRLINE INPUTS AND SELECTS
   ============================================================ */

#createAirlineForm input,
#createAirlineForm select {
  display: block;

  width: 100%;
  height: 50px;

  margin: 0;
  padding: 0 17px;

  box-sizing: border-box;

  color: #ffffff;

  background:
    rgba(2, 9, 22, 0.74);

  border:
    1px solid rgba(255, 179, 0, 0.42);

  border-radius: 10px;

  font-family:
    "Segoe UI",
    sans-serif;

  font-size: 0.9rem;
  font-weight: 500;

  letter-spacing: 0.01em;

  outline: none;

  box-shadow:
    inset 0 0 12px rgba(0, 0, 0, 0.38);

  transition:
    border-color 0.25s ease,
    box-shadow 0.25s ease,
    background 0.25s ease;
}

#createAirlineForm input::placeholder {
  color:
    rgba(230, 235, 248, 0.68);
}

#createAirlineForm select {
  cursor: pointer;
}

#createAirlineForm input:focus,
#createAirlineForm select:focus {
  background:
    rgba(3, 12, 29, 0.92);

  border-color:
    rgba(255, 202, 99, 0.86);

  box-shadow:
    0 0 12px rgba(255, 179, 0, 0.18),
    inset 0 0 12px rgba(0, 0, 0, 0.38);
}


/* ============================================================
   AUTO GENERATED CODES
   ============================================================ */

#createAirlineForm input[readonly] {

    rgba(199, 211, 237, 0.82);

  background:
    rgba(3, 12, 29, 0.58);

  cursor: default;
}

/* ============================================================
   AIRLINE PROFILE MODAL
   ============================================================ */

.active-airline-card {
  cursor: pointer;

  transition:
    transform 0.2s ease,
    border-color 0.2s ease,
    box-shadow 0.2s ease;
}

  padding: 27px;

  box-sizing: border-box;

  overflow: hidden;

  color: #edf4ff;

  background:

  right: 0;

const realAirlines = [
  "American Airlines","Delta Air Lines","Lufthansa","Emirates","Qatar Airways",
  "Turkish Airlines","Singapore Airlines","British Airways","United Airlines",
  "Air France","Iberia","LATAM","Avianca","Air Europa","Air Canada",
  "Aeroflot","Alaska Airlines","JetBlue","Southwest Airlines","EasyJet","Ryanair"
];

/* ============================================================
   🔒 SUBMIT LOCK (ANTI DUPLICATE)
   ============================================================ */
let isSubmittingAirline = false;

/* ============================================================
   LOAD OFFICIAL ONBOARDING BASE FROM RAILWAY
   ============================================================ */
async function updateCountries() {

  try {
    const response = await fetch(
      "https://api.aviationcapitalsim.com/v1/users/base-context",
      {
        credentials: "include"
      }
    );

    const result = await response.json();

    if (
      !response.ok ||
      !result.ok ||
      !result.base
    ) {
      throw new Error(
        result.error ||
        "ONBOARDING_BASE_CONTEXT_FAILED"
      );
    }

    const region =
      String(result.base.region || "").trim();

    const country =
      String(result.base.country || "").trim();

    if (!region || !country) {
      throw new Error(
        "ONBOARDING_BASE_CONTEXT_INCOMPLETE"
      );
    }

    const regionSelect =
      document.getElementById("region");

    const countrySelect =
      document.getElementById("country");

    regionSelect.value = region;

    countrySelect.innerHTML = "";

    const countryOption =
      document.createElement("option");

    countryOption.value = country;
    countryOption.textContent = country;

    countrySelect.appendChild(countryOption);

  } catch (error) {
    console.error(
      "CREATE AIRLINE BASE ERROR:",
      error
    );
  }

}
     
function generateUniqueCodes() {
  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const random = (n) =>
    Array.from({ length: n }, () => letters[Math.floor(Math.random() * letters.length)]).join("");

  document.getElementById("iata").value = random(2);
  document.getElementById("icao").value = random(3);
}

/* ============================================================
   HANDLE AIRLINE CREATION (CLEAN)
   ============================================================ */

async function handleAirlineCreation(event) {
  event.preventDefault();

  // 🚫 BLOQUEO DOBLE SUBMIT
  if (isSubmittingAirline) {
    console.warn("🚫 Duplicate submit blocked");
    return false;
  }

  isSubmittingAirline = true;

  const user = await getActiveUser();

  if (!user) {
    isSubmittingAirline = false;
    alert("⚠ Session required. Please login.");
    window.location.href = "login.html";
    return false;
  }

  const airlineName = document.getElementById("airlineName").value.trim();
  const region = document.getElementById("region").value;
  const country = document.getElementById("country").value;
  const businessModel = document.getElementById("businessModel").value;
  const operationMode = document.getElementById("operationMode").value;
  const slogan = document.getElementById("slogan").value.trim();
  const icao = document.getElementById("icao").value.trim().toUpperCase();
  const iata = document.getElementById("iata").value.trim().toUpperCase();

  const normalizedName = airlineName.toLowerCase().replace(/[^a-z\s]/gi, "").trim();

  if (realAirlines.some(real => {
    const realNorm = real.toLowerCase().replace(/[^a-z\s]/gi, "").trim();
    return normalizedName.includes(realNorm) || realNorm.includes(normalizedName);
  })) {
    isSubmittingAirline = false;
    alert("⚠️ That airline name is too similar to a real-world airline.");
    return false;
  }

  const airline = {
    name: airlineName,
    icao,
    iata,
    slogan,
    region,
    country,
    businessModel,
    operationMode
  };

  const ACS_API_URL = "https://api.aviationcapitalsim.com/v1/airlines/create";

  try {

    const res = await fetch(ACS_API_URL, {
      method: "POST",
      credentials: "include",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        airline_name: airline.name,
        airline_iata: airline.iata,
        airline_icao: airline.icao,
        country,
        region,
        business_model: businessModel,
        operation_mode: operationMode
      })
    });

    const result = await res.json();

    if (!result.ok) {
      isSubmittingAirline = false;
      alert("❌ Server error: " + (result.error || "Unknown"));
      return false;
    }

    /* 🧹 CLEAN LEGACY CACHE */
    localStorage.removeItem("ACS_baseICAO");
    localStorage.removeItem("ACS_baseIATA");
    localStorage.removeItem("ACS_baseCity");
    localStorage.removeItem("ACS_baseName");
    localStorage.removeItem("ACS_baseCountry");
    localStorage.removeItem("ACS_baseContinent");
    localStorage.removeItem("ACS_baseReady");

    alert("✔ Airline synced with server!");
    window.location.href = "choose_base.html";

  } catch (err) {
    console.error("CREATE_AIRLINE ERROR:", err);
    isSubmittingAirline = false;
    alert("❌ Error connecting to ACS server: " + err.message);
  }

  return false;
}

/* ============================================================
   SESSION (BACKEND ONLY)
   ============================================================ */

async function getActiveUser(){

  try{
    const res = await fetch("https://api.aviationcapitalsim.com/v1/session", {
      credentials: "include"
    });

    const data = await res.json();

    if(!data.ok) return null;

    return data.user;

  }catch(err){
    console.error("SESSION ERROR:", err);
    return null;
  }
}

async function getSimYear(){

  try{
    const res = await fetch("https://api.aviationcapitalsim.com/v1/world", {
      credentials: "include"
    });

    const data = await res.json();

    const simStart =
      data?.world?.sim_start ||
      data?.sim_start ||
      null;

    if (!simStart) {
      console.error("WORLD PAYLOAD INVALID:", data);
      return null;
    }

    return new Date(simStart).getFullYear();

  }catch(err){
    console.error("WORLD FETCH ERROR:", err);
    return null;
  }

}
     
/* ============================================================
   ACTIVE AIRLINES — INITIALS
   ============================================================ */

function getAirlineInitials(airlineName) {

  const originalName =
    String(airlineName || "").trim();

  const separatedName =
    originalName
      .replace(/[_-]+/g, " ")
      .replace(/([a-z])([A-Z])/g, "$1 $2")
      .trim();

  const words =
    separatedName
      .split(/\s+/)
      .map(word =>
        word.replace(/[^A-Za-z0-9]/g, "")
      )
      .filter(Boolean);

  if (words.length >= 2) {
    return (
      words[0].charAt(0) +
      words[1].charAt(0)
    ).toUpperCase();
  }

  const singleWord =
    String(words[0] || "").toUpperCase();

  if (
    singleWord.startsWith("AERO") &&
    singleWord.length > 4
  ) {
    return (
      "A" +
      singleWord.charAt(4)
    ).toUpperCase();
  }

  const firstLetter =
    singleWord.charAt(0) || "-";

  return (
    firstLetter +
    firstLetter
  ).toUpperCase();
}


/* ============================================================
   ACTIVE AIRLINES — COUNTRY FLAG
   ============================================================ */

function getCountryFlag(countryCode) {

  const code =
    String(countryCode || "")
      .trim()
      .toUpperCase();

  if (!/^[A-Z]{2}$/.test(code)) {
    return "🌐";
  }

  return String.fromCodePoint(
    ...Array.from(code).map(
      letter =>
        127397 + letter.charCodeAt(0)
    )
  );
}


/* ============================================================
   AIRLINE PROFILE MODAL
   ============================================================ */

function formatCompanyValue(value) {

  const amount = Number(value);

  if (!Number.isFinite(amount)) {
    return "PENDING";
  }

  return new Intl.NumberFormat(
    "en-US",
    {
      style: "currency",
      currency: "USD",
      notation: "compact",
      maximumFractionDigits: 2
    }
  ).format(amount);
}

function closeAirlineProfile() {

  const overlay =
    document.getElementById(
      "airlineProfileOverlay"
    );

  if (!overlay) {
    return;
  }

  overlay.hidden = true;

  document.body.style.overflow = "";
}

function ensureAirlineProfileModal() {

  let overlay =
    document.getElementById(
      "airlineProfileOverlay"
    );

  if (overlay) {
    return overlay;
  }

  overlay =
    document.createElement("div");

  overlay.id =
    "airlineProfileOverlay";

  overlay.className =
    "airline-profile-overlay";

  overlay.hidden = true;

  overlay.innerHTML = `
    <section
      class="airline-profile-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="airlineProfileName"
    >
      <div class="airline-profile-header">

        <div
          id="airlineProfileInitials"
          class="airline-profile-initials"
        ></div>

        <div class="airline-profile-heading">
          <div class="airline-profile-label">
            Airline Profile
          </div>

          <div
            id="airlineProfileName"
            class="airline-profile-name"
          ></div>
        </div>

        <button
          type="button"
          class="airline-profile-close"
          aria-label="Close"
        >
          ×
        </button>

      </div>

      <div class="airline-profile-grid">

        <div class="airline-profile-stat">
          <div class="airline-profile-stat-label">
            Business Model
          </div>

          <div
            id="airlineProfileBusinessModel"
            class="airline-profile-stat-value"
          ></div>
        </div>

        <div class="airline-profile-stat">
          <div class="airline-profile-stat-label">
            Company Value
          </div>

          <div
            id="airlineProfileCompanyValue"
            class="airline-profile-stat-value"
          ></div>
        </div>

        <div class="airline-profile-stat">
          <div class="airline-profile-stat-label">
            Active Aircraft
          </div>

          <div
            id="airlineProfileAircraft"
            class="airline-profile-stat-value"
          ></div>
        </div>

        <div class="airline-profile-stat">
          <div class="airline-profile-stat-label">
            Active Routes
          </div>

          <div
            id="airlineProfileRoutes"
            class="airline-profile-stat-value"
          ></div>
        </div>

        <div class="airline-profile-stat">
          <div class="airline-profile-stat-label">
            Global Rank
          </div>

          <div
            id="airlineProfileRank"
            class="airline-profile-stat-value"

  `;

  overlay

    )
    .addEventListener(

  overlay.addEventListener(
    "click",
    event => {
      if (event.target === overlay) {
        closeAirlineProfile();
      }
    }
  );

  document.addEventListener(
    "keydown",
    event => {
      if (
        event.key === "Escape" &&
        !overlay.hidden
      ) {

      }
    }
  );

  document.body.appendChild(overlay);

  return overlay;
}

function openAirlineProfile(airline) {

  const overlay =
    ensureAirlineProfileModal();

  document.getElementById(
    "airlineProfileInitials"
  ).textContent =
    getAirlineInitials(
      airline.airline_name
    );

  document.getElementById(
    "airlineProfileName"
  ).textContent =
    airline.airline_name ||
    "Unnamed Airline";

  document.getElementById(
    "airlineProfileBusinessModel"
  ).textContent =
    airline.business_model ||
    "NOT AVAILABLE";

  document.getElementById(
    "airlineProfileCompanyValue"
  ).textContent =
    formatCompanyValue(
      airline.company_value
    );

  document.getElementById(
    "airlineProfileAircraft"
  ).textContent =
    String(
      Number(
        airline.active_aircraft || 0
      )
    );

  document.getElementById(
    "airlineProfileRoutes"
  ).textContent =
    String(
      Number(
        airline.active_routes || 0
      )
    );

  document.getElementById(
    "airlineProfileRank"
  ).textContent =
    Number.isInteger(
      Number(airline.global_rank)
    )
      ? `#${Number(airline.global_rank)}`
      : "UNRANKED";

  overlay.hidden = false;

  document.body.style.overflow =
    "hidden";

  overlay
    .querySelector(
      ".airline-profile-close"
    )
    .focus();
}


/* ============================================================
   ACTIVE AIRLINES — CARD
   ============================================================ */

function createActiveAirlineCard(airline) {

  const card =
    document.createElement("article");

  card.className =
    "active-airline-card";

  card.setAttribute(
    "role",
    "button"
  );

  card.setAttribute(
    "tabindex",
    "0"
  );

  card.setAttribute(
    "aria-label",
    `Open ${airline.airline_name || "airline"} profile`
  );

  card.addEventListener(
    "click",
    () => {
      openAirlineProfile(airline);
    }
  );

  card.addEventListener(
    "keydown",
    event => {
      if (
        event.key === "Enter" ||
        event.key === " "
      ) {
        event.preventDefault();
        openAirlineProfile(airline);
      }
    }
  );

  const initials =
    document.createElement("div");

  initials.className =
    "active-airline-initials";

  initials.textContent =
    getAirlineInitials(
      airline.airline_name
    );

  const info =
    document.createElement("div");

  info.className =
    "active-airline-info";

  const name =
    document.createElement("div");

  name.className =
    "active-airline-name";

  name.textContent =
    airline.airline_name ||
    "Unnamed Airline";

  const location =
    document.createElement("div");

  location.className =
    "active-airline-location";

  const country =
    String(
      airline.country ||
      "Unknown Country"
    );

  const countryFlag =
    getCountryFlag(
      airline.country_code
    );

  const baseIcao =
    String(
      airline.base_icao || "----"
    ).toUpperCase();

  location.textContent =
    `${countryFlag} ${country} · ${baseIcao}`;

  info.appendChild(name);
  info.appendChild(location);

  card.appendChild(initials);
  card.appendChild(info);

  return card;
}

/* ============================================================
   ACTIVE AIRLINES — LOAD
   ============================================================ */

async function loadActiveAirlines() {

  const list =
    document.getElementById(
      "activeAirlinesList"
    );

  if (!list) {
    return;
  }

  try {

    const response = await fetch(
      "https://api.aviationcapitalsim.com/v1/airlines/active",
      {
        credentials: "include"
      }
    );

    const result =
      await response.json();

    if (
      !response.ok ||
      !result.ok
    ) {
      throw new Error(
        result.error ||
        "ACTIVE_AIRLINES_REQUEST_FAILED"
      );
    }

    list.replaceChildren();

    const airlines =
      Array.isArray(result.airlines)
        ? result.airlines
        : [];

    if (airlines.length === 0) {

      const emptyState =
        document.createElement("div");

      emptyState.className =
        "active-airlines-status";

      emptyState.textContent =
        "No active airlines";

      list.appendChild(emptyState);

      return;
    }

    const fragment =
      document.createDocumentFragment();

    airlines.forEach(airline => {
      fragment.appendChild(
        createActiveAirlineCard(airline)
      );
    });

    list.appendChild(fragment);

  } catch (err) {

    console.error(
      "ACTIVE AIRLINES ERROR:",
      err
    );

    const errorState =
      document.createElement("div");

    errorState.className =
      "active-airlines-status is-error";

    errorState.textContent =
      "Airlines unavailable";

    list.replaceChildren(errorState);
  }
}


/* ============================================================
   INIT
   ============================================================ */

document.addEventListener("DOMContentLoaded", async () => {

  window.ACS_SIM_YEAR = await getSimYear();

  console.log(
    "🌍 SIM YEAR:",
    window.ACS_SIM_YEAR
  );

  const user = await getActiveUser();

  if (!user) {
    alert("⚠ Session required. Please login.");
    window.location.href = "login.html";
    return;
  }

  await Promise.all([
    loadActiveAirlines(),
    updateCountries()
  ]);

  const airlineInput =
    document.getElementById("airlineName");

  if (airlineInput) {
    airlineInput.addEventListener(
      "input",
      generateUniqueCodes
    );
  }

  const regionSelect =
    document.getElementById("region");

  if (regionSelect) {
    regionSelect.addEventListener(
      "change",
      async () => {
        await updateCountries();
      }
    );
  }

});
